<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self driving cars</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1>World Editor</h1>
    <canvas id="myCanvas"></canvas>
    <div id="controls">
        <button onclick="dispose()">Dispose</button>
        <button onclick="save()">Save</button>
        &nbsp;
        <button id="graphBtn" onclick="setMode('graph')">Graph</button>
        <button id="stopBtn" onclick="setMode('stop')">Stop</button>
    </div>
    
<script src="src/world.js"></script>
<script src="src/graphEditor.js"></script>
<script src="src/viewport.js"></script>
<script src="src/items/tree.js"></script>
<script src="src/items/building.js"></script>
<script src="src/math/graph.js"></script>
<script src="src/math/utils.js"></script>
<script src="src/primitives/point.js"></script>
<script src="src/primitives/segment.js"></script>
<script src="src/primitives/polygon.js"></script>
<script src="src/primitives/envelope.js"></script>
<script>

    myCanvas.width = 600;
    myCanvas.height = 600;
    
    const ctx = myCanvas.getContext("2d");

    const graphString = localStorage.getItem("graph");
    const graphInfo = graphString ? JSON.parse(graphString) : null;
    const graph = graphInfo 
    ? Graph.load(graphInfo)
    : new Graph();

    const world = new World(graph);
    const viewport = new Viewport(myCanvas);
    const graphEditor = new GraphEditor(viewport, graph);

    let oldGraphHash = graph.hash();
    animate();

    function animate() {
        viewport.reset();
        if (graph.hash() != oldGraphHash) {
            world.generate();
            oldGraphHash = graph.hash();
        }
        const viewPoint = scale(viewport.getOffset(), -1);
        world.draw(ctx, viewPoint);
        ctx.globalAlpha = 0.3;
        graphEditor.display();
        requestAnimationFrame(animate);
    }

    function dispose() {
        graphEditor.dispose();
    }

    function save() {
        localStorage.setItem("graph", JSON.stringify(graph));
    }
</script>
</body>
</html>
